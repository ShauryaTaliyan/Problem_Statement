<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="glassFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A192F" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="100" height="100" rx="24" fill="#0A192F" />
  <!-- Isometric 3D Hex Prism -->
  <g filter="url(#shadow)" transform="translate(10, 10)">
    <!-- Top Face -->
    <polygon points="40,10 70,25 40,40 10,25" fill="url(#glassFacet)" />
    <!-- Left Face -->
    <polygon points="10,25 40,40 40,70 10,55" fill="url(#primaryGrad)" />
    <!-- Right Face -->
    <polygon points="40,40 70,25 70,55 40,70" fill="#0891B2" />
    <!-- Core Star/Compass node -->
    <circle cx="40" cy="40" r="5" fill="#FFFFFF" />
  </g>
</svg>
